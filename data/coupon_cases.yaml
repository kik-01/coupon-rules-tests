# 判定表数据（14 条）
# 每条 = 判定表里的一行：条件（商品、券）→ 期望动作（减多少、能不能用、运费多少）
#
# 为什么放 YAML 而不是写在测试文件里：
#   1. 新增一个组合只加一段数据，不碰测试逻辑，也不用改缩进
#   2. 期望值是手算的，跟代码分开存放，避免"改代码顺手把期望值也改了"
#   3. diff 干净，产品/研发也能看
#
# 金额单位一律为「分」，必须是整数；写成 128.00 这类浮点会在加载时报错（见 tests/case_loader.py）。

